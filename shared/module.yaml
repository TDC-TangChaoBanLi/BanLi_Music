product:
  type: kmp/lib
  platforms: [android, jvm]

repositories:
  - id: mavenCentral
    url: https://repo1.maven.org/maven2
  - id: mavenGoogle
    url: https://dl.google.com/dl/android/maven2

settings:
  compose:
    enabled: true
    resources:
      packageName: com.banlimusic.shared.resources
      exposedAccessors: true
  kotlin:
    version: 2.4.21
    serialization:
      enabled: true
      version: "1.12.0"
  android:
    namespace: com.banlimusic.shared
    compileSdk: 37
  jvm:
    release: 17
    jdk:
      version: 25
      selectionMode: auto

dependencies:
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - $libs.okhttp
  - $compose.foundation
  - $compose.components.resources
  - $libs.compose.material.icons.extended
  - $libs.compose.material3
