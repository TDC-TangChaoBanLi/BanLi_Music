product: jvm/app

repositories:
  - id: mavenCentral
    url: https://repo1.maven.org/maven2
  - id: mavenGoogle
    url: https://dl.google.com/dl/android/maven2

dependencies:
  - //shared
  - $compose.desktop.currentOs
  # Kept alongside currentOs so the executable jar also carries Windows Skiko
  # natives and can be packaged from Linux/WSL without a Windows host.
  - org.jetbrains.compose.desktop:desktop-jvm-windows-x64:1.12.1
  - $compose.material3
  - $libs.compose.material.icons.core
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - $libs.okhttp
  - $libs.jlayer

settings:
  compose: enabled
  kotlin:
    serialization:
      enabled: true
      version: "1.12.0"
  jvm:
    mainClass: com.banlimusic.desktop.MainKt
    release: 17
    jdk:
      version: 25
      selectionMode: auto
