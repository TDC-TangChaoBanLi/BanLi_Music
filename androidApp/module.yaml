product: android/app

# maven.google.com is unreachable on this machine; use the equivalent
# dl.google.com endpoint while keeping the default repository id.
repositories:
  - id: mavenCentral
    url: https://repo1.maven.org/maven2
  - id: mavenGoogle
    url: https://dl.google.com/dl/android/maven2

dependencies:
  - bom: androidx.compose:compose-bom:2026.09.00
  - $libs.androidx.core.ktx
  - $libs.androidx.activity.compose
  - $libs.androidx.lifecycle.runtime.ktx
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.navigation.compose
  - $libs.androidx.compose.ui
  - $libs.androidx.compose.ui.graphics
  - $libs.androidx.compose.ui.tooling.preview
  - $libs.androidx.compose.material3
  - $libs.androidx.compose.material.icons.extended
  - $libs.androidx.compose.ui.tooling
  - $libs.androidx.media3.exoplayer
  - $libs.androidx.media3.session
  - $libs.androidx.media3.ui
  - $libs.androidx.room.runtime
  - $libs.androidx.room.ktx
  - $libs.androidx.work.runtime.ktx
  - $libs.androidx.glance.appwidget
  - $libs.androidx.glance.material3
  - $libs.androidx.datastore.preferences
  - $libs.okhttp
  - $libs.kotlinx.serialization.json
  - $libs.kotlinx.coroutines.android
  - $libs.coil.compose
  - $libs.coil.network.okhttp

test-dependencies:
  - $libs.junit
  - $libs.mockwebserver
  - $libs.kotlinx.coroutines.test

settings:
  kotlin:
    version: 2.4.21
    serialization:
      enabled: true
      version: "1.12.0"
    ksp:
      processors:
        - $libs.androidx.room.compiler
      processorOptions:
        room.schemaLocation: schemas
  android:
    namespace: com.banlimusic.app
    applicationId: com.banlimusic.app
    compileSdk: 37
    minSdk: 26
    targetSdk: 37
    versionCode: 2
    versionName: "0.2.0"
    resourcePackaging:
      excludes:
        - META-INF/{AL2.0,LGPL2.1}
  compose: enabled
  junit: junit-4
  jvm:
    release: 17
    jdk:
      version: 25
      selectionMode: auto
